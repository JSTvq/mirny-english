<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="1;url=https://selection-rhythm-arrested-cuisine.trycloudflare.com/">
  <title>Mirny English — открываем портал</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2e9;
      --paper: #fcfaf5;
      --ink: #1d2a23;
      --muted: #667064;
      --moss: #2d5a45;
      --line: #e4ddcf;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 10% 5%, rgba(225, 207, 170, .42), transparent 28rem),
        radial-gradient(circle at 90% 10%, rgba(196, 216, 198, .48), transparent 30rem),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    .card {
      width: min(100%, 430px);
      padding: 40px 30px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(252, 250, 245, .92);
      box-shadow: 0 18px 50px rgba(45, 57, 46, .07);
      text-align: center;
    }

    .mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 17px;
      background: var(--moss);
      color: #f8f3e7;
      box-shadow: 0 8px 20px rgba(45, 90, 69, .2);
    }

    .mark svg { width: 32px; height: 32px; }

    .eyebrow {
      color: var(--moss);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: 1.05;
    }

    p {
      margin: 0 auto 24px;
      max-width: 310px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 11px 22px;
      border-radius: 12px;
      background: var(--moss);
      color: #fffdf7;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: background .18s ease, transform .18s ease;
    }

    .button:hover {
      background: #234735;
      transform: translateY(-1px);
    }

    .note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .note a { color: var(--moss); text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M25.5 5.8C15.6 7.4 8.6 13.6 8.6 21.4c0 2.7 1.9 4.4 4.4 4.4 8 0 12.5-7.9 12.5-20Z" fill="currentColor"/>
        <path d="M7.2 27.2c2.8-6.9 8.1-11.3 15.5-14.1" stroke="#2d5a45" stroke-width="2.1" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="eyebrow">Mirny English</span>
    <h1>Открываем портал</h1>
    <p>Сейчас перенаправим вас в учебную библиотеку Mirny English. Если переход не начался, используйте кнопку ниже.</p>
    <a class="button" id="open" href="https://selection-rhythm-arrested-cuisine.trycloudflare.com/">Открыть Mirny English</a>
    <p class="note">Портал работает в демонстрационном режиме. Если ссылка не открылась,<br>попробуйте ещё раз через несколько секунд.</p>
  </main>
  <script>
    const target = 'https://selection-rhythm-arrested-cuisine.trycloudflare.com/';
    window.setTimeout(() => window.location.replace(target), 900);
  </script>
</body>
</html>
